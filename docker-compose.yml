version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gmpp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-gmpp_db}
      POSTGRES_USER:     ${DB_USERNAME:-gmpp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gmpp_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USERNAME:-gmpp_user} -d ${DB_NAME:-gmpp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gmpp-net]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gmpp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@gmpp.ma}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@2024}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on: [postgres]
    networks: [gmpp-net]

  pg_backup:
    image: postgres:15-alpine
    container_name: gmpp_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST:     postgres
      POSTGRES_DB:       ${DB_NAME:-gmpp_db}
      POSTGRES_USER:     ${DB_USERNAME:-gmpp_user}
      PGPASSWORD:        ${DB_PASSWORD:-gmpp_password}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c "while true; do
        TIMESTAMP=$$(date +%Y%m%d_%H%M);
        pg_dump -h postgres -U $${POSTGRES_USER} $${POSTGRES_DB} > /backups/gmpp_$${TIMESTAMP}.sql;
        echo 'Backup done: gmpp_'$${TIMESTAMP}'.sql';
        find /backups -name '*.sql' -mtime +30 -delete;
        sleep 86400;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gmpp-net]

  backend:
    build: ./backend
    container_name: gmpp_backend
    restart: unless-stopped
    environment:
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${DB_NAME:-gmpp_db}
      DB_USERNAME:   ${DB_USERNAME:-gmpp_user}
      DB_PASSWORD:   ${DB_PASSWORD:-gmpp_password}
      JWT_SECRET:    ${JWT_SECRET:-gmppSecretKey2024VeryLongAndSecureKeyForHS256!}
      MAIL_HOST:     ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:     ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL:  ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR:    /app/uploads
      LOG_DIR:       /app/logs
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [gmpp-net]

  frontend:
    build: ./frontend
    container_name: gmpp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      retries: 3
    networks: [gmpp-net]

volumes:
  postgres_data:
  pgadmin_data:
  backups:
  uploads:
  logs:

networks:
  gmpp-net:
    driver: bridge
